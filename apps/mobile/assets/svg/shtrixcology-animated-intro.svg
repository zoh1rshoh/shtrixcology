<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title">
<title>SHTRIXCOLOGY animated intro logo</title>
<defs>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#D8FF76"/><stop offset=".35" stop-color="#72E52D"/><stop offset=".7" stop-color="#159A47"/><stop offset="1" stop-color="#063D2A"/>
 </linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2s" repeatCount="indefinite"/>
 </linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="700" fill="#050706"/>
<g id="emblem" transform="translate(230 30) scale(.86)" fill="url(#green)" stroke="#B9FF63" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">
 <path id="upper-ribbon" d="M368 66H246C162 66 96 112 96 179c0 54 47 77 111 96l105 31c40 12 61 27 61 51 0 33-39 57-91 57H137l54 36h93c104 0 174-42 174-108 0-48-37-76-109-97l-108-31c-39-11-60-25-60-48 0-31 32-55 75-55h143z" stroke-dasharray="1400" stroke-dashoffset="1400">
  <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="1.1s" fill="freeze"/>
  <animate attributeName="opacity" values="0.25;1" dur="1.1s" fill="freeze"/>
 </path>
 <path id="upper-leaf" d="M250 212c26-62 78-91 151-103-8 63-49 101-151 103z" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin=".55s" dur=".45s" fill="freeze"/>
  <animateTransform attributeName="transform" type="scale" additive="sum" from=".6 .6" to="1 1" begin=".55s" dur=".45s" fill="freeze"/>
 </path>
 <path id="lower-leaf" d="M145 376c37-59 91-83 161-75-28 49-78 76-161 75z" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin=".75s" dur=".45s" fill="freeze"/>
 </path>
</g>
<g id="wordmark" opacity="0" transform="translate(0 18)">
 <text x="450" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" letter-spacing="1.5" fill="#F4F6F5">SHTRI<tspan fill="#77E52F">X</tspan>COLOGY</text>
 <animate attributeName="opacity" from="0" to="1" begin=".9s" dur=".65s" fill="freeze"/>
 <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin=".9s" dur=".65s" fill="freeze"/>
</g>
<g id="tagline" opacity="0">
 <text x="450" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="5" fill="#F4F6F5">HAR BIR QADOQQA — IKKINCHI HAYOT</text>
 <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur=".55s" fill="freeze"/>
</g>
<rect x="0" y="0" width="900" height="700" fill="url(#shine)" opacity=".14" pointer-events="none"/>
</svg>